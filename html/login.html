<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switch Login</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#ffffff;--bd:#d7dde4;--fg:#1a222c;--fg2:#5c6773;
  --ac:#0969da;--acfg:#ffffff;--bad:#cf222e;
}
:root[data-theme="dark"]{
  --bg:#0e1116;--panel:#161b22;--bd:#2c333c;--fg:#e6edf3;--fg2:#8d96a0;
  --ac:#4c8ef7;--acfg:#ffffff;--bad:#f85149;
}
:root[data-theme="sel-dark"]{
  --bg:#103c48;--panel:#184956;--bd:#2d5b69;--fg:#adbcbc;--fg2:#72898f;
  --ac:#4695f7;--acfg:#ffffff;--bad:#fa5750;
}
:root[data-theme="sel-light"]{
  --bg:#fbf3db;--panel:#ece3cc;--bd:#d5cdb6;--fg:#53676d;--fg2:#909995;
  --ac:#0072d4;--acfg:#ffffff;--bad:#d2212d;
}
*{box-sizing:border-box;margin:0}
body{
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--fg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
}
.card{
  background:var(--panel);border:1px solid var(--bd);border-radius:12px;
  padding:36px 32px;width:min(360px,92vw);
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
h1{font-size:19px;font-weight:650}
p.sub{color:var(--fg2);font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
.pwrow{position:relative}
input.pw{
  width:100%;padding:10px 44px 10px 12px;font-size:15px;color:var(--fg);
  background:var(--bg);border:1px solid var(--bd);border-radius:8px;outline:none;
}
input.pw:focus{border-color:var(--ac)}
/* Reveal toggle inside the field, at its right edge. */
.eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;margin:0;padding:0;display:flex;align-items:center;justify-content:center;
  color:var(--fg2);background:transparent;border:0;border-radius:6px;cursor:pointer;
}
.eye:hover{color:var(--fg);background:var(--bg)}
.eye:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.eye svg{width:19px;height:19px;pointer-events:none}
.eye .ic-shut{display:none}
.eye.on .ic-occhi{display:none}
.eye.on .ic-shut{display:block}
button{
  width:100%;margin-top:18px;padding:10px;font-size:15px;font-weight:600;
  color:var(--acfg);background:var(--ac);border:0;border-radius:8px;cursor:pointer;
}
button:hover{filter:brightness(1.1)}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:14px;text-align:center}
</style>
<script>
(function(){
  var pref;
  try{pref=localStorage.getItem("theme")||"auto";}catch(e){pref="auto";}
  var dark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  var t=pref;
  if(pref==="auto")t=dark?"dark":"light";
  if(pref==="auto-sel")t=dark?"sel-dark":"sel-light";
  document.documentElement.dataset.theme=t;
})();
</script>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="2">
      <rect x="2" y="7" width="20" height="10" rx="2"/>
      <path d="M6 11v2M10 11v2M14 11v2M18 11v2"/>
    </svg>
    <h1 id="hn">Switch Login</h1>
  </div>
  <p class="sub" id="sub">RTLPlayground management interface</p>
  <form method="post" action="login">
    <label for="pwd" id="lp">Password</label>
    <div class="pwrow">
      <input id="pwd" class="pw" name="pwd" type="password" autocomplete="current-password" autofocus required
             oninput="document.getElementById('err').textContent=''">
      <button type="button" class="eye" id="pwtoggle" aria-pressed="false"
              aria-label="Show password" title="Show password">
        <svg class="ic-occhi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="ic-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3l18 18"/><path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.7 18.7 0 0 1-3.2 4.1"/>
          <path d="M6.6 6.7A18.6 18.6 0 0 0 1 12s4 7 11 7a10.8 10.8 0 0 0 5.4-1.4"/>
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
        </svg>
      </button>
    </div>
    <button type="submit" id="lb">Sign in</button>
    <div id="err"></div>
  </form>
</div>
<script>
(function(){
  var L={
    de:["Switch-Anmeldung","RTLPlayground-Verwaltungsoberfläche","Passwort","Anmelden","Falsches Passwort, bitte erneut versuchen.","Passwort anzeigen","Passwort verbergen"],
    en:["Switch Login","RTLPlayground management interface","Password","Sign in","Wrong password, try again.","Show password","Hide password"],
    ja:["スイッチ ログイン","RTLPlayground 管理インターフェース","パスワード","ログイン","パスワードが違います。もう一度お試しください。","パスワードを表示","パスワードを隠す"],
    zh:["交换机登录","RTLPlayground 管理界面","密码","登录","密码错误，请重试。","显示密码","隐藏密码"],
    es:["Inicio de sesión del switch","Interfaz de gestión de RTLPlayground","Contraseña","Iniciar sesión","Contraseña incorrecta, inténtalo de nuevo.","Mostrar contraseña","Ocultar contraseña"],
    fr:["Utilisateur du commutateur","Interface de management RTLPlayground","Mot de passe","Se connecter","Mot de passe erronné, essayez à nouveau.","Afficher le mot de passe","Masquer le mot de passe"]
  };
  var l=null;
  try{l=localStorage.getItem("rtl_lang");}catch(e){}
  if(!L[l])l=(navigator.language||"en").slice(0,2);
  window.__loginI18n=s;
  var s=L[l]||L.en;
  // Name the tab after the switch: the hostname seen at the last login here,
  // otherwise the address, so several open switches can be told apart
  var host=null;
  try{host=localStorage.getItem("rtl_host");}catch(e){}
  document.title=(host||location.hostname)+" – "+s[0];
  document.getElementById("hn").textContent=host||s[0];
  document.getElementById("sub").textContent=s[1];
  document.getElementById("lp").textContent=s[2];
  document.getElementById("lb").textContent=s[3];
  if(document.referrer.endsWith("login.html"))document.getElementById("err").textContent=s[4];
})();
</script>
</body>
</html>
