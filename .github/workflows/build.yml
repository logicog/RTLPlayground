name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6
        with:
          path: branch

      - uses: actions/checkout@v6
        with:
          path: main
          ref: main

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y
      - name: Run the host-side unit tests
        run: cd branch && make -C test
      - name: Check if machine.c can be compiled for all machines
        run: cd branch && make machine_check
      - name: Make project (4x2/RTL8372)
        run: cd branch && make CI=1 MACHINE="KP_9000_6XHML_X2" | tee /tmp/build_KP_9000_6XHML_X2.branch.log
      - name: Make project (8x1/RTL8373)
        run: cd branch && make CI=1 MACHINE="KP_9000_9XHML_X_V3_1"
      - name: Make project with the health instrumentation
        run: cd branch && make clean && make CI=1 MACHINE="KP_9000_6XHML_X2" HEALTH=1
      - name: Make main
        run: cd main && make CI=1 MACHINE="KP_9000_6XHML_X2" | tee /tmp/build_KP_9000_6XHML_X2.main.log
      - name: Calculate bank growth
        run: |
          sed -n 's/^Bank \([0-9]\): [Bb]ytes read: \([0-9]\+\)$/MAIN_BANK_\1=\2/p' /tmp/build_*.main.log >> "$GITHUB_ENV"
          sed -n 's/^Bank \([0-9]\): [Bb]ytes read: \([0-9]\+\)$/BRANCH_BANK_\1=\2/p' /tmp/build_*.branch.log >> "$GITHUB_ENV"
      - name: Update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: Sizes
          message: |
            ## Image Growth Sizes

            ### Main
            ```text
            Bank 0:  ${{  env.MAIN_BANK_0 }}
            Bank 1:  ${{  env.MAIN_BANK_1 }}
            Bank 2:  ${{  env.MAIN_BANK_2 }}
            Bank 3:  ${{  env.MAIN_BANK_3 }}
            ```
            ### Branch
            ```text
            Bank 0:  ${{  env.BRANCH_BANK_0 }}
            Bank 1:  ${{  env.BRANCH_BANK_1 }}
            Bank 2:  ${{  env.BRANCH_BANK_2 }}
            Bank 3:  ${{  env.BRANCH_BANK_3 }}
            ```
