name: Build RY‑4GT‑2SX Firmware

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:   # 网页手动触发编译

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        build_cfg:
          # 基础固件
          - { machine: "KP_9000_6XHML_X2", health: 0 }
          # 带健康检测instrument版本
          - { machine: "KP_9000_6XHML_X2", health: 1 }
          # 如果你已经写好 machines/RY_4GT_2SX/machine.c，注释上面两行，启用下面两行
          #‑ { machine: "RY_4GT_2SX", health: 0 }
          #‑ { machine: "RY_4GT_2SX", health: 1 }

    steps:
      - name: Checkout source & submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev

      - name: Host unit tests
        run: make -C test

      - name: machine.c syntax check for all boards
        run: make machine_check

      - name: Compile MACHINE=${{ matrix.build_cfg.machine }} HEALTH=${{ matrix.build_cfg.health }}
        run: |
          make clean
          make CI=1 \
            MACHINE=${{ matrix.build_cfg.machine }} \
            HEALTH=${{ matrix.build_cfg.health }}

      - name: Upload compiled firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fw‑${{ matrix.build_cfg.machine }}‑HEALTH${{ matrix.build_cfg.health }}
          path: |
            *.bin
            *.hex
            installer/*.bin
          retention-days: 30
