name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc g++ bison flex libboost-dev patch bzip2 curl ca-certificates xxd python-is-python3 libjson-c-dev zlib1g-dev -y
      - name: Cache the patched SDCC
        uses: actions/cache@v4
        with:
          path: toolchain
          key: sdcc-${{ hashFiles('sdcc/*') }}
      - name: Run the host-side unit tests
        run: make -C test
      - name: Check that every machine definition can be compiled
        run: make machine_check
      - name: Make project (4x2/RTL8372)
        run: make CI=1 MACHINE="KP_9000_6XHML_X2"
      - name: Make project (8x1/RTL8373)
        run: make CI=1 MACHINE="KP_9000_9XHML_X_V3_1"
      - name: Make project with the health instrumentation
        run: make clean && make CI=1 MACHINE="KP_9000_6XHML_X2" HEALTH=1
