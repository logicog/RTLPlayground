name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          path: ../main-checkout
          ref: main

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev -y
      - name: Run the host-side unit tests
        run: make -C test
      - name: Check if machine.c can be compiled for all machines
        run: make machine_check
      - name: Make project (4x2/RTL8372)
        run: make CI=1 MACHINE="KP_9000_6XHML_X2" | tee /tmp/build_KP_9000_6XHML_X2.branch.log
      - name: Make project (8x1/RTL8373)
        run: make CI=1 MACHINE="KP_9000_9XHML_X_V3_1"
      - name: Make project with the health instrumentation
        run: make clean && make CI=1 MACHINE="KP_9000_6XHML_X2" HEALTH=1
      - name: Make main
        run: cd ../main-checkout && make CI=1 MACHINE="KP_9000_6XHML_X2" | tee /tmp/build_KP_9000_6XHML_X2.main.log
      - name: Calculate bank growth
        run: |
          export $(sed -n 's/^Bank \([0-9]\): [Bb]ytes read: \([0-9]\+\)$/MAIN_BANK_\1=\2/p' /tmp/build_*.main.log$)
          export $(sed -n 's/^Bank \([0-9]\): [Bb]ytes read: \([0-9]\+\)$/BRANCH_BANK_\1=\2/p' /tmp/build_*.branch.log)
          echo $(($MAIN_BANK_0-$BRANCH_BANK_0))) $(($MAIN_BANK_1-$BRANCH_BANK_1))) $(($MAIN_BANK_2-$BRANCH_BANK_2))) $(($MAIN_BANK_3-$BRANCH_BANK_3)))
